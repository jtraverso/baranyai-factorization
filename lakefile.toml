name = "baranyai_factorization"
version = "0.1.0"
defaultTargets = ["BaranyaiLib", "BaranyaiChallenge", "BaranyaiSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "dross"
git = "https://github.com/jtraverso/dross-fractional-triangle-decomposition"
rev = "7720b7b591e606d5a56f1d935d8be650dcbf6c6f"

[[lean_lib]]
name = "BaranyaiLib"
globs = ["BaranyaiLib.+"]

[[lean_lib]]
name = "BaranyaiChallenge"
roots = ["BaranyaiChallenge"]

[[lean_lib]]
name = "BaranyaiSolution"
roots = ["BaranyaiSolution"]
