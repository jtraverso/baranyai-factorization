name = "baranyai_factorization"
version = "0.1.0"
defaultTargets = ["FlowLib", "BaranyaiLib", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "FlowLib"
globs = ["FlowLib.+"]

[[lean_lib]]
name = "BaranyaiLib"
globs = ["BaranyaiLib.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
