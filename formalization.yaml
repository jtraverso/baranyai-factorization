version: "v0.4"

project:
  name: "Baranyai's theorem"
  description: >-
    A Lean 4 / Mathlib formalization of Baranyai's theorem: if k divides n, the k-subsets of an
    n-set can be partitioned into (n−1 choose k−1) parallel classes, each a partition of the set
    into n/k blocks of size k (a 1-factorization of the complete k-uniform hypergraph); and of
    Baranyai's rounding lemma: every real matrix can be rounded entrywise to floors or ceilings so
    that all row sums, column sums and the total are also rounded. The proof includes the integral
    max-flow theorem for integer capacities. Mathlib has neither result.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C65", "05C70", "90C35"]

sources:
  - title: "On the factorization of the complete uniform hypergraph"
    authors:
      - "Zsolt Baranyai"
    type: "paper"
    location: "Infinite and Finite Sets (Proc. Colloq. Keszthely, 1973), Colloq. Math. Soc. János Bolyai 10, North-Holland (1975), 91–108"
    relationship: "formalizes"
    note: "Baranyai's theorem and the rounding lemma; no DOI."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A Course in Combinatorics (2nd edition)"
    authors:
      - "J. H. van Lint"
      - "R. M. Wilson"
    id: "doi:10.1017/CBO9780511987045"
    type: "book"
    location: "Cambridge University Press (2001), Chapter 38"
    relationship: "background"
    note: "Textbook proof of Baranyai's theorem by flows."
    license: "all rights reserved"
    author_endorsement: "n/a"
  - title: "Maximal flow through a network"
    authors:
      - "L. R. Ford"
      - "D. R. Fulkerson"
    id: "doi:10.4153/CJM-1956-045-5"
    type: "paper"
    location: "Canadian Journal of Mathematics 8 (1956), 399–404"
    relationship: "background"
    note: "Max-flow/min-cut and integrality of flows, proved here for integer capacities."
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations:
  - id: "PALOMAR-2026-10-15-000008 (jtraverso/dross-fractional-triangle-decomposition)"
    relationship: "builds-on"
    note: >-
      The same author's entry; its finite max-flow/min-cut theorem (`LeanPool/MaxFlowMinCut.lean`
      there, `FlowLib/MaxFlowMinCut.lean` here) is included unchanged and used for the integral
      flow theorem.

status:
  scope: >-
    The rounding lemma is proved for every real m × n matrix (m, n ≥ 0); Baranyai's theorem for
    all n and k with 0 < k and k ∣ n. The general form of Baranyai's theorem (almost-regular
    factorizations when k does not divide n) is not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan (integral
        flows, rounding through a transportation network, Baranyai's induction on the number of
        elements) on top of the existing max-flow library; it proved the missing integral flow
        theorem itself. The return was audited (statements, definitions and headers unchanged,
        library unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build`, `#print axioms` and a comparison of the
        elaborated Challenge and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types and definitions for the Challenge/Solution pair).

fidelity:
  divergences: >-
    The n-set is `Fin n`; a parallel class is a `Finset` of `Finset (Fin n)` in which every element
    lies in exactly one block and every block has k elements; the classes are indexed by
    `Fin ((n - 1).choose (k - 1))` (natural-number subtraction, with 0 < k). The rounding lemma is
    stated for matrices `Fin m → Fin n → ℝ` with `Int.floor` and `Int.ceil`; "rounded" means equal
    to the floor or to the ceiling, for every entry, every row sum, every column sum and the total.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Baranyai's theorem and rounding lemma, checked the encoding of
    parallel classes, checked that the Aristotle return left every statement, definition and
    header and the reused library unchanged, and confirmed by `lake build`, `#print axioms` and a
    comparison of the fully elaborated Challenge and Solution declarations that the proofs use no
    `sorry` and only propext, Classical.choice and Quot.sound. The author directed the work and
    approved the statements. No independent human mathematical review has been performed. The
    results are classical; no mathematical novelty is claimed.

alignment:
  namespace: "BaranyaiTheorem"
  statements:
    - source: "Baranyai (1975): rounding lemma"
      lean: "BaranyaiTheorem.rounding"
      module: "Challenge"
      status: "proved"
    - source: "Baranyai (1975): K_n^(k) has a 1-factorization when k divides n"
      lean: "BaranyaiTheorem.baranyai"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
